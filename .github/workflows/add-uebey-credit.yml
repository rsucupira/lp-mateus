name: Adicionar assinatura Uebey

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-uebey-credit.yml'

permissions:
  contents: write

jobs:
  update-credit:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Inserir assinatura Uebey
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          credit = '''<a class="uebey-credit" href="https://uebey.com" target="_blank" rel="noopener noreferrer" aria-label="Desenvolvido por Uebey"><span class="uebey-credit__icon" aria-hidden="true"><svg viewBox="0 0 30 36" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 3v17c0 8 4.6 13 11 13s11-5 11-13V3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M8 5v15c0 5.5 2.9 9 7 9s7-3.5 7-9V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".76"/><path d="M12 7v13c0 2.8 1.2 4.7 3 4.7s3-1.9 3-4.7V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".52"/></svg></span><span>Desenvolvido por <strong>Uebey</strong></span></a>'''

          # index.html
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'class="uebey-credit"' not in s:
              old = '<a href="#topo">Voltar ao topo</a>\n    </div>\n  </footer>'
              new = '<div class="footer-actions"><a href="#topo">Voltar ao topo</a>' + credit + '</div>\n    </div>\n  </footer>'
              if old not in s:
                  raise SystemExit('Trecho do rodapé não encontrado; abortando com segurança.')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          # styles.css
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          if '.uebey-credit {' not in s:
              old = '.footer-inner a { text-decoration: none; }'
              new = '''.footer-inner a { text-decoration: none; }
.footer-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 22px;
  white-space: nowrap;
}
.uebey-credit {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: rgba(255,255,255,.42) !important;
  font-size: .72rem !important;
  transition: color .2s ease, opacity .2s ease;
  opacity: .86;
}
.uebey-credit__icon {
  width: 16px;
  height: 19px;
  display: inline-flex;
  color: var(--accent);
  filter: drop-shadow(0 0 7px rgba(156,135,98,.12));
}
.uebey-credit__icon svg { width: 100%; height: 100%; display: block; }
.uebey-credit strong {
  color: rgba(255,255,255,.58);
  font-weight: 650;
  transition: color .2s ease;
}
.uebey-credit:hover { color: rgba(255,255,255,.72) !important; opacity: 1; }
.uebey-credit:hover strong { color: var(--accent); }'''
              if old not in s:
                  raise SystemExit('CSS do rodapé não encontrado; abortando com segurança.')
              s = s.replace(old, new, 1)
              old_mobile = '  .footer-inner { gap: 22px; }'
              new_mobile = '  .footer-inner { gap: 22px; }\n  .footer-actions { justify-content: space-between; gap: 16px; flex-wrap: wrap; }\n  .uebey-credit { margin-left: auto; }'
              if old_mobile in s:
                  s = s.replace(old_mobile, new_mobile, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar alteração
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nada para publicar."
            exit 0
          fi
          git config user.name "Rodrigo Sucupira"
          git config user.email "64866757+rsucupira@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Adicionar assinatura discreta da Uebey no rodapé"
          git push origin main
